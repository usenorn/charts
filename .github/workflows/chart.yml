name: chart

on:
  pull_request:
    paths:
      - norn/**
      - .github/workflows/chart.yml
  push:
    branches: [main]
    paths:
      - norn/**
      - .github/workflows/chart.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v4.1.0

      # appVersion is the default image tag: norn.image falls back to it whenever a user has
      # not set images.<name>.tag or .digest. A tag nobody can pull is a chart that does not
      # install, so both checks gate every change.
      - name: appVersion is a release tag
        run: |
          set -euo pipefail
          app_version=$(yq '.appVersion' norn/Chart.yaml)
          if [[ ! "$app_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Chart.yaml appVersion must be a vMAJOR.MINOR.PATCH release tag; got '$app_version'" >&2
            exit 1
          fi

      - name: appVersion images are pullable
        run: |
          set -euo pipefail
          app_version=$(yq '.appVersion' norn/Chart.yaml)
          for image in norn-api norn-web; do
            token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${{ github.repository_owner }}/${image}:pull&service=ghcr.io" \
              | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
            code=$(curl -sSL -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${{ github.repository_owner }}/${image}/manifests/${app_version}")
            if [ "$code" != "200" ]; then
              echo "ghcr.io/${{ github.repository_owner }}/${image}:${app_version} is not anonymously pullable (HTTP $code)" >&2
              exit 1
            fi
          done

      - name: Lint
        run: helm lint norn --strict

      - name: Render supported configurations
        run: |
          helm template norn norn --namespace norn --kube-version 1.34.0 >/dev/null
          helm template norn norn --namespace norn --kube-version 1.36.0 --values norn/ci/autoscaling-values.yaml >/dev/null
          helm template norn norn --namespace norn --kube-version 1.36.0 --values norn/ci/external-values.yaml >/dev/null

      - name: Reject incomplete external configuration
        run: |
          if helm template norn norn --set postgresql.enabled=false >/dev/null 2>&1; then
            echo "chart accepted a disabled PostgreSQL service without an external DSN" >&2
            exit 1
          fi

      - name: Package
        run: helm package norn --destination /tmp
