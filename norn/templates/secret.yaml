{{- if not .Values.norn.existingSecret }}
{{- $name := printf "%s-env" (include "norn.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $securityKey := randBytes 32 -}}
{{- $postgresPassword := randAlphaNum 32 -}}
{{- $valkeyPassword := randAlphaNum 32 -}}
{{- $garageAccessKey := printf "GK%s" (randAlphaNum 32) -}}
{{- $garageSecretKey := sha256sum (randAlphaNum 64) -}}
{{- $garageRPCSecret := sha256sum (randAlphaNum 64) -}}
{{- $garageAdminToken := randBytes 32 -}}
{{- $garageMetricsToken := randBytes 32 -}}
{{- if $existing }}
{{- $securityKey = index $existing.data "NORN_SECURITY_ENCRYPTION_KEY" | b64dec -}}
{{- $postgresPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec -}}
{{- $valkeyPassword = index $existing.data "VALKEY_PASSWORD" | b64dec -}}
{{- $garageAccessKey = index $existing.data "GARAGE_DEFAULT_ACCESS_KEY" | b64dec -}}
{{- $garageSecretKey = index $existing.data "GARAGE_DEFAULT_SECRET_KEY" | b64dec -}}
{{- $garageRPCSecret = index $existing.data "GARAGE_RPC_SECRET" | b64dec -}}
{{- $garageAdminToken = index $existing.data "GARAGE_ADMIN_TOKEN" | b64dec -}}
{{- $garageMetricsToken = index $existing.data "GARAGE_METRICS_TOKEN" | b64dec -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "norn.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  NORN_SECURITY_ENCRYPTION_KEY: {{ $securityKey | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  VALKEY_PASSWORD: {{ $valkeyPassword | quote }}
  GARAGE_DEFAULT_ACCESS_KEY: {{ $garageAccessKey | quote }}
  GARAGE_DEFAULT_SECRET_KEY: {{ $garageSecretKey | quote }}
  GARAGE_RPC_SECRET: {{ $garageRPCSecret | quote }}
  GARAGE_ADMIN_TOKEN: {{ $garageAdminToken | quote }}
  GARAGE_METRICS_TOKEN: {{ $garageMetricsToken | quote }}
  valkey.conf: |
    appendonly yes
    maxmemory-policy noeviction
    requirepass {{ $valkeyPassword }}
  {{- if .Values.postgresql.enabled }}
  NORN_POSTGRES_DSN: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgresql.auth.username $postgresPassword (include "norn.postgresqlHost" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  NORN_POSTGRES_DSN: {{ .Values.postgresql.external.dsn | quote }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  NORN_VALKEY_PASSWORD: {{ $valkeyPassword | quote }}
  NORN_ASYNQ_PASSWORD: {{ $valkeyPassword | quote }}
  {{- else }}
  {{- with .Values.valkey.external.password }}
  NORN_VALKEY_PASSWORD: {{ . | quote }}
  NORN_ASYNQ_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.garage.enabled }}
  NORN_STORAGE_ACCESS_KEY_ID: {{ $garageAccessKey | quote }}
  NORN_STORAGE_SECRET_ACCESS_KEY: {{ $garageSecretKey | quote }}
  {{- else }}
  NORN_STORAGE_ACCESS_KEY_ID: {{ .Values.garage.external.accessKeyId | quote }}
  NORN_STORAGE_SECRET_ACCESS_KEY: {{ .Values.garage.external.secretAccessKey | quote }}
  {{- end }}
  {{- range $key, $value := .Values.norn.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
