{{- if .Values.garage.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "norn.garageHost" . }}
  labels:
    {{- include "norn.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = {{ .Values.garage.region | quote }}
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.localhost"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "norn.garageHost" . }}
  labels:
    {{- include "norn.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
  {{- with .Values.garage.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.garage.service.type }}
  selector:
    {{- include "norn.componentSelectorLabels" (dict "root" . "component" "garage") | nindent 4 }}
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: admin
      port: 3903
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "norn.garageHost" . }}
  labels:
    {{- include "norn.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
spec:
  serviceName: {{ include "norn.garageHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "norn.componentSelectorLabels" (dict "root" . "component" "garage") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "norn.componentSelectorLabels" (dict "root" . "component" "garage") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- include "norn.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: garage
          image: {{ include "norn.image" (dict "root" . "image" .Values.garage.image) }}
          imagePullPolicy: {{ .Values.garage.image.pullPolicy }}
          command:
            - /garage
          args:
            - server
            - --single-node
            - --default-bucket
          env:
            - name: GARAGE_DEFAULT_BUCKET
              value: {{ .Values.garage.bucket | quote }}
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "norn.secretName" . }}
                  key: GARAGE_DEFAULT_ACCESS_KEY
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "norn.secretName" . }}
                  key: GARAGE_DEFAULT_SECRET_KEY
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "norn.secretName" . }}
                  key: GARAGE_RPC_SECRET
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "norn.secretName" . }}
                  key: GARAGE_ADMIN_TOKEN
            - name: GARAGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "norn.secretName" . }}
                  key: GARAGE_METRICS_TOKEN
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          volumeMounts:
            - name: data
              mountPath: /var/lib/garage
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - /garage
                - status
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /garage
                - status
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /garage
                - status
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.garage.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "norn.garageHost" . }}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.garage.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.garage.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.garage.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.garage.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.garage.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "norn.labels" . | nindent 10 }}
          app.kubernetes.io/component: garage
      spec:
        accessModes:
          {{- toYaml .Values.garage.persistence.accessModes | nindent 10 }}
        {{- with .Values.garage.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.garage.persistence.size }}
  {{- end }}
{{- end }}
